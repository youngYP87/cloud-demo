server:
   port: 8000
spring:
   profiles:
      active: dev
      include: feign
   application:
      name: service-order
   cloud:
      nacos:
         # 配置 Nacos 地址
         server-addr: 127.0.0.1:8848
         config:
            namespace: ${spring.profiles.active:public}
            import-check:
               enabled: false

logging:
   level:
      # 指定 feign 接口所在的包的日志级别为 debug 级别
      com.atguigu.order.feign: debug

---
spring:
   config:
      import:
         - nacos:common.properties?group=order
         - nacos:database.properties?group=order
      activate:
         on-profile: dev

---
spring:
   config:
      import:
         - nacos:common.properties?group=order
         - nacos:database.properties?group=order
         - nacos:haha.properties?group=order
      activate:
         on-profile: test

---
spring:
   config:
      import:
         - nacos:common.properties?group=order
         - nacos:database.properties?group=order
         - nacos:hehe.properties?group=order
      activate:
         on-profile: prod